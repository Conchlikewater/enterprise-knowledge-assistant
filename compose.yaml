services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${RAG_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8000"
    environment:
      RAG_ENVIRONMENT: ${RAG_ENVIRONMENT:-development}
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8000
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_UPLOAD_DIR: /app/data/uploads
      RAG_SQLITE_PATH: /app/data/app.db
      RAG_SQLITE_BUSY_TIMEOUT_MS: ${RAG_SQLITE_BUSY_TIMEOUT_MS:-5000}
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-knowledge_chunks}
      RAG_QDRANT_TIMEOUT_SECONDS: ${RAG_QDRANT_TIMEOUT_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-64}
      RAG_OPENAI_TIMEOUT_SECONDS: ${RAG_OPENAI_TIMEOUT_SECONDS:-30}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-5.6-sol}
      RAG_DEEPSEEK_BASE_URL: ${RAG_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RAG_LLM_REASONING_EFFORT: ${RAG_LLM_REASONING_EFFORT:-low}
      RAG_LLM_VERBOSITY: ${RAG_LLM_VERBOSITY:-low}
      RAG_LLM_MAX_OUTPUT_TOKENS: ${RAG_LLM_MAX_OUTPUT_TOKENS:-800}
      RAG_LLM_TIMEOUT_SECONDS: ${RAG_LLM_TIMEOUT_SECONDS:-60}
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-10485760}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      RAG_ENVIRONMENT: ${RAG_ENVIRONMENT:-development}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_UPLOAD_DIR: /app/data/uploads
      RAG_SQLITE_PATH: /app/data/app.db
      RAG_SQLITE_BUSY_TIMEOUT_MS: ${RAG_SQLITE_BUSY_TIMEOUT_MS:-5000}
      RAG_WORKER_POLL_INTERVAL_SECONDS: ${RAG_WORKER_POLL_INTERVAL_SECONDS:-0.5}
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-knowledge_chunks}
      RAG_QDRANT_TIMEOUT_SECONDS: ${RAG_QDRANT_TIMEOUT_SECONDS:-5}
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-64}
      RAG_OPENAI_TIMEOUT_SECONDS: ${RAG_OPENAI_TIMEOUT_SECONDS:-30}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-150}
    volumes:
      - app_data:/app/data
    restart: "on-failure:3"

volumes:
  app_data:
  qdrant_data:
